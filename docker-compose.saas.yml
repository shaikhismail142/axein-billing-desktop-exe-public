services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axein}
      POSTGRES_USER: ${POSTGRES_USER:-axein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - axein_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axein} -d ${POSTGRES_DB:-axein}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile.saas
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      AXEIN_DEPLOYMENT_MODE: saas
      DATABASE_URL: postgresql://${POSTGRES_USER:-axein}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-axein}
      AXEIN_SESSION_SECRET: ${AXEIN_SESSION_SECRET:?set AXEIN_SESSION_SECRET}
      AXEIN_INTEGRATION_SECRET_DEFENZO: ${AXEIN_INTEGRATION_SECRET_DEFENZO:-}
      APP_ACTIVATION_REQUIRED: "false"
      AXEIN_PUBLIC_URL: https://billing.axein.in
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-0}
    ports: ["127.0.0.1:3199:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  axein_postgres:
networks:
  backend:
    internal: true
