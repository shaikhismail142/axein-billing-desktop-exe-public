name: Desktop Windows Release

on:
  workflow_dispatch:
    inputs:
      require_signed:
        description: "Require valid Authenticode signature in verification"
        type: boolean
        default: false
      run_smoke:
        description: "Run desktop smoke test before packaging"
        type: boolean
        default: true

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      AXEIN_REQUIRE_SIGNED: ${{ inputs.require_signed && '1' || '0' }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Desktop preflight
        run: npm run desktop:preflight

      - name: Desktop web build
        run: npm run desktop:web:build

      - name: Prepare runtime
        run: npm run desktop:prepare-runtime

      - name: LAN security self-test
        run: npm run desktop:lan:selftest

      - name: Desktop smoke
        if: ${{ inputs.run_smoke }}
        run: npm run desktop:smoke

      - name: Build + metadata + strict verify
        run: npm run desktop:release:windows

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axein-desktop-installer
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/release/SHA256SUMS.txt
            desktop/release/release-manifest.json
            desktop/release/installer-verification.json
            desktop/release/RELEASE_NOTES.template.md
