name: Desktop CI

on:
  push:
    branches:
      - main
      - master
      - codex/**
  pull_request:

jobs:
  desktop-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Desktop preflight
        run: npm run desktop:preflight

      - name: Desktop web build
        run: npm run desktop:web:build

      - name: Prepare desktop runtime
        run: npm run desktop:prepare-runtime

      - name: LAN security self-test
        run: npm run desktop:lan:selftest

      - name: Desktop smoke test
        run: npm run desktop:smoke

      - name: Release verifier script sanity (allow missing installer)
        run: npm run desktop:release:verify -- --allow-missing
