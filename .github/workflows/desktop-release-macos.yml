name: Desktop macOS Release

on:
  workflow_dispatch:
    inputs:
      build_keygen:
        description: "Also build staff Keygen DMG"
        type: boolean
        default: true

jobs:
  build-dmg:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Desktop preflight
        run: npm run desktop:preflight

      - name: Build Billing DMG
        run: npm run desktop:build:macos

      - name: Build staff Keygen DMG
        if: ${{ inputs.build_keygen }}
        env:
          AXEIN_KEYGEN_PRIVATE_KEY_PEM_B64: ${{ secrets.AXEIN_KEYGEN_PRIVATE_KEY_PEM_B64 }}
        run: npm run desktop:keygen:build:macos

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axein-desktop-dmg-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

