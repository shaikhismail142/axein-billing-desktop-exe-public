name: Desktop macOS Release

on:
  workflow_dispatch:
    inputs:
      build_keygen:
        description: "Also build staff Keygen DMG"
        type: boolean
        default: true

jobs:
  build-dmg:
    # Build both Apple Silicon + Intel DMGs from a single Apple Silicon runner.
    # This avoids depending on GitHub Intel runner availability.
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Desktop preflight
        run: npm run desktop:preflight

      - name: Prepare DMG staging dir
        run: |
          rm -rf desktop/release/macos-dmg
          mkdir -p desktop/release/macos-dmg

      - name: Build Billing DMG (arm64)
        run: npm run desktop:build:macos

      - name: Build staff Keygen DMG (arm64)
        if: ${{ inputs.build_keygen }}
        env:
          AXEIN_KEYGEN_PRIVATE_KEY_PEM_B64: ${{ secrets.AXEIN_KEYGEN_PRIVATE_KEY_PEM_B64 }}
        run: npm run desktop:keygen:build:macos

      - name: Collect DMGs (arm64)
        run: |
          ls -la desktop/src-tauri/target/release/bundle/dmg || true
          cp -f desktop/src-tauri/target/release/bundle/dmg/*.dmg desktop/release/macos-dmg/ || true

      - name: Add Intel build target
        run: rustup target add x86_64-apple-darwin

      - name: Build Billing DMG (x86_64)
        run: |
          npm run desktop:bundle-node
          npm run desktop:tauri -- build --target x86_64-apple-darwin --config ./desktop/src-tauri/tauri.macos.conf.json

      - name: Build staff Keygen DMG (x86_64)
        if: ${{ inputs.build_keygen }}
        env:
          AXEIN_KEYGEN_PRIVATE_KEY_PEM_B64: ${{ secrets.AXEIN_KEYGEN_PRIVATE_KEY_PEM_B64 }}
        run: |
          npm run desktop:bundle-node
          npm run desktop:tauri -- build --target x86_64-apple-darwin --config ./desktop/src-tauri/tauri.keygen.macos.conf.json

      - name: Collect DMGs (x86_64)
        run: |
          ls -la desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg || true
          cp -f desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg desktop/release/macos-dmg/ || true

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axein-desktop-dmg
          if-no-files-found: error
          path: |
            desktop/release/macos-dmg/*.dmg
